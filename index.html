<div class="toast-zone" id="toast-zone" role="status" aria-live="polite"></div>
<script>
'use strict';
const STORAGE_KEY='study-rpg-v1-storage';
const taskPriorities={low:'低',medium:'普通',high:'高'};
const difficultyRewards={easy:2,normal:4,hard:7};
const gear=[
 {id:'wood',kind:'weapon',name:'橡木短劍',icon:'🗡️',price:45,bonus:5,desc:'ATK +5 · 新手最可靠的夥伴'},
 {id:'iron',kind:'weapon',name:'鐵製長劍',icon:'⚔️',price:100,bonus:11,desc:'ATK +11 · 適合挑戰精英怪'},
 {id:'star',kind:'weapon',name:'星輝之刃',icon:'🌟',price:225,bonus:19,desc:'ATK +19 · 冒險者的夢想'},
 {id:'cloth',kind:'armor',name:'旅行披風',icon:'🧥',price:45,bonus:3,desc:'DEF +3 · 輕便又實用'},
 {id:'plate',kind:'armor',name:'守護護甲',icon:'🛡️',price:115,bonus:8,desc:'DEF +8 · 可靠防護'},
 {id:'dragon',kind:'armor',name:'龍鱗戰甲',icon:'🐉',price:245,bonus:15,desc:'DEF +15 · 地城的最後防線'}
];
const zoneNames={hub:'冒險主城',study:'專注書房',dungeon:'冒險地城',character:'角色背包',shop:'冒險商店',settings:'遊戲設定'};
let route='hub',demo=false,editingTaskId=null,taskFilter='open',timerAnchor=0,logs=['冒險開始！先完成讀書，累積 AP 再挑戰怪物。'],audioCtx=null;
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=()=>Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dateKey(d=new Date()){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function defaultState(){return {version:1,player:{level:1,xp:0,hp:100,ap:0,gold:15,potions:1,owned:[],weapon:null,armor:null,boost:false},progress:{chapter:1,step:0,monsterHp:null},timer:{type:'focus',minutes:25,breakMinutes:5,mode:'strict',remainingMs:25*60000,running:false,rewarded:false,sessionId:uid()},tasks:[],study:{totalMinutes:0,totalSessions:0,tasksDone:0,todayMinutes:0,todaySessions:0,todayTasks:0,day:dateKey(),earnedToday:0,history:[]},sound:false}}
function load(){try{let v=JSON.parse(localStorage.getItem(STORAGE_KEY));if(!v||v.version!==1||!v.player||!v.timer||!Array.isArray(v.tasks)||!v.study)return defaultState();v.timer.running=false;v.timer.remainingMs=Math.max(0,Number(v.timer.remainingMs)||0);return v}catch{return defaultState()}}
let state=load();
function save(){if(demo)return;try{const s=clone(state);s.timer.remainingMs=remainingMs();s.timer.running=false;localStorage.setItem(STORAGE_KEY,JSON.stringify(s))}catch(e){showToast('此瀏覽器無法儲存進度，請檢查隱私模式或儲存空間。','error')}}
function normalizeDay(){const today=dateKey();if(state.study.day!==today){state.study.day=today;state.study.earnedToday=0;state.study.todayMinutes=0;state.study.todaySessions=0;state.study.todayTasks=0;save()}}
function levelThreshold(lv){return 70+(lv-1)*40}
function maxHP(){return 100+(state.player.level-1)*16}
function attackStat(){let w=gear.find(g=>g.id===state.player.weapon);return 19+(state.player.level-1)*4+(w?w.bonus:0)}
function defenseStat(){let a=gear.find(g=>g.id===state.player.armor);return a?a.bonus:0}
function monster(){const {chapter,step}=state.progress;const elite=step===3,boss=step===4;const types=['slime','bat','golem','elite','boss'];const baseHP=[48,55,70,118,170][step];const atk=[7,9,11,15,20][step];const names=['森林史萊姆','夜行蝙蝠','石塊守衛','暗影騎士','深淵魔龍'];return {type:types[step],name:names[step],kind:boss?'BOSS':elite?'ELITE':'NORMAL',hp:baseHP+(chapter-1)*(boss?42:17),atk:atk+(chapter-1)*3,xp:[24,30,37,62,110][step]+(chapter-1)*14,gold:[15,19,23,38,75][step]+(chapter-1)*9}}
function enemyHP(){return state.progress.monsterHp==null?monster().hp:state.progress.monsterHp}
function remainFmt(ms){let total=Math.ceil(Math.max(0,ms)/1000);return String(Math.floor(total/60)).padStart(2,'0')+':'+String(total%60).padStart(2,'0')}
function remainingMs(){return state.timer.running?Math.max(0,state.timer.remainingMs-(Date.now()-timerAnchor)):state.timer.remainingMs}
function pauseTimer(silent=false){if(!state.timer.running)return;state.timer.remainingMs=remainingMs();state.timer.running=false;timerAnchor=0;save();if(!silent)showToast('⏸ 已暫停，剩餘時間已儲存。')}
function resetTimer(type=state.timer.type){state.timer.type=type;state.timer.remainingMs=(demo&&type==='focus'?15:type==='focus'?state.timer.minutes*60:state.timer.breakMinutes*60)*1000;state.timer.running=false;state.timer.rewarded=false;state.timer.sessionId=uid();timerAnchor=0;save()}
function grantAP(amount,source){normalizeDay();const available=Math.max(0,40-state.study.earnedToday);const real=Math.min(amount,available);state.player.ap+=real;state.study.earnedToday+=real;state.study.history.unshift({time:new Date().toLocaleString('zh-TW',{hour12:false}),label:source,ap:real});state.study.history=state.study.history.slice(0,25);showToast(real===amount?`✨ ${source}，獲得 ${real} AP！`:real?`✨ ${source}，獲得 ${real} AP（今日已達上限）`:`今日已達 40 AP 上限；讀書成果仍正常記錄。`,real?'good':'');playSound('reward');return real}
function finishTimer(){if(!state.timer.running)return;state.timer.remainingMs=0;state.timer.running=false;timerAnchor=0;if(state.timer.rewarded)return;state.timer.rewarded=true;if(state.timer.type==='focus'){normalizeDay();const minutes=demo?0:state.timer.minutes;state.study.totalMinutes+=minutes;state.study.todayMinutes+=minutes;state.study.totalSessions++;state.study.todaySessions++;const pts=demo?3:Math.floor(minutes/5);grantAP(pts,demo?'15 秒展示專注':'完成 '+minutes+' 分鐘專注')}else{showToast('☕ 休息完成！準備好下一次冒險了嗎？','good');playSound('reward')}save();renderAll()}
function startTimer(){if(state.timer.running)return;if(remainingMs()<=0)resetTimer();if(!demo&&state.timer.type==='focus'&&state.timer.minutes<15)return showToast('正式專注最少 15 分鐘','error');state.timer.running=true;timerAnchor=Date.now();save();renderAll()}
function formatToday(){return new Date().toLocaleDateString('zh-TW',{month:'long',day:'numeric',weekday:'long'})}
function capRatio(){return state.study.earnedToday/40*100}
function header(){document.getElementById('header-ap').textContent=state.player.ap;document.getElementById('header-gold').textContent=state.player.gold;document.getElementById('header-level').textContent=state.player.level;document.getElementById('location-label').textContent=zoneNames[route];document.querySelectorAll('[data-nav]').forEach(b=>{b.classList.toggle('active',b.dataset.nav===route);b.setAttribute('aria-current',b.dataset.nav===route?'page':'false')});document.getElementById('demo-indicator').innerHTML=demo?'<span class="tag">🧪 DEMO</span>':'';document.getElementById('sidebar-details').innerHTML=`<div class="side-card"><div class="small-title">今日的冒險能量</div><div class="row" style="margin-top:10px"><b style="color:var(--gold)">${state.study.earnedToday}/40 AP</b><span style="font-size:11px;color:var(--muted)">${Math.round(capRatio())}%</span></div><div class="tiny-progress"><div style="width:${capRatio()}%"></div></div><span class="tiny" style="color:var(--muted)">每一次努力都算數 ✨</span></div><div class="side-foot">SINGLE FILE · OFFLINE READY</div>`;document.getElementById('demo-banner').innerHTML=demo?'<div class="demo-banner"><span>🧪 展示模式 · 15 秒快速體驗，所有操作都不會改變正式存檔</span><button class="button sm" data-act="exit-demo">退出展示</button></div>':''}
function openPage(name){if(!zoneNames[name])return;route=name;editingTaskId=null;renderAll();window.scrollTo({top:0,behavior:'smooth'})}
function renderAll(){normalizeDay();header();document.getElementById('page').innerHTML=({hub:pageHub,study:pageStudy,dungeon:pageDungeon,character:pageCharacter,shop:pageShop,settings:pageSettings})[route]();refreshTimerUI()}
function kpi(icon,value,label){return `<div class="card stat-card"><div class="stat-icon">${icon}</div><div class="stat-value">${esc(value)}</div><div class="stat-caption">${esc(label)}</div></div>`}
const heroSVG=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 144" aria-label="像素風勇者角色" role="img" shape-rendering="crispEdges"><path fill="#403958" d="M36 124h60v10H36z"/><path fill="#cbd3ec" d="M47 19h34v7H47zM39 26h50v11H39z"/><path fill="#705fa9" d="M39 36h50v10H39z"/><path fill="#e6b08a" d="M48 40h32v26H48z"/><path fill="#553a49" d="M40 33h48v9H40zM47 42h7v6h-7zm26 0h7v6h-7z"/><path fill="#283653" d="M53 54h6v6h-6zm17 0h6v6h-6z"/><path fill="#ecdcbd" d="M51 48h26v7H51z"/><path fill="#b8a7f0" d="M40 68h48v38H40z"/><path fill="#6f66b6" d="M30 76h12v28H30zm56 0h12v28H86z"/><path fill="#d6a381" d="M30 98h12v11H30zm56 0h12v11H86z"/><path fill="#f8d291" d="M57 70h14v22H57z"/><path fill="#674f8c" d="M45 90h38v16H45z"/><path fill="#aa82df" d="M53 106h22v7H53z"/><path fill="#444d79" d="M44 111h17v19H44zm24 0h17v19H68z"/><path fill="#202840" d="M41 128h21v10H41zm26 0h21v10H67z"/><path fill="#e8d8fa" d="M12 48h9v39h-9z"/><path fill="#9b96be" d="M4 61h25v11H4z"/><path fill="#aa8df5" d="M15 28h5v33h-5z"/><path fill="#f4c775" d="M13 83h9v8h-9z"/><path fill="#f4dfae" d="M100 78h23v21h-23z"/><path fill="#d29658" d="M98 75h27v6H98zM98 96h27v5H98z"/><path fill="#e3a853" d="M107 83h9v9h-9z"/></svg>`;
function monsterSVG(type){if(type==='slime')return `<svg viewBox="0 0 128 144" role="img" aria-label="史萊姆" shape-rendering="crispEdges"><path fill="#66c2b4" d="M42 45h44v9h16v12h10v43h-9v10H25v-10h-9V68h11V55h15z"/><path fill="#9df0d4" d="M43 46h40v10H41zM27 70h13v15H27z"/><path fill="#397a84" d="M38 80h12v15H38zm40 0h12v15H78z"/><path fill="#fff" d="M41 82h5v6h-5zm40 0h5v6h-5z"/><path fill="#325c6d" d="M57 103h18v6H57z"/><path fill="#56969c" d="M18 105h92v12H18z"/></svg>`;

return `<svg viewBox="0 0 128 144" role="img" aria-label="深淵魔龍" shape-rendering="crispEdges"><path fill="#b86a82" d="M22 12h21v25H22zm65 0h21v25H87z"/><path fill="#71446d" d="M26 25h78v57H26zM13 52h23v46H13zm79 0h23v46H92z"/><path fill="#df8f94" d="M34 42h60v30H34z"/><path fill="#272a4e" d="M40 54h18v11H40zm30 0h18v11H70z"/><path fill="#ffcf70" d="M47 56h9v7h-9zm24 0h9v7h-9z"/><path fill="#bd6983" d="M44 77h42v39H44z"/><path fill="#f1c8b4" d="M48 79h9v15h-9zm23 0h9v15h-9z"/><path fill="#41334f" d="M21 101h24v29H21zm65 0h24v29H86z"/><path fill="#e59f8b" d="M46 109h40v10H46z"/></svg>`}
function pageHub(){let m=monster(),p=state.player;return `<section class="hero-section"><div class="hero-copy"><div class="eyebrow">✦ YOUR JOURNEY BEGINS HERE</div><h1>今天的努力，<br><strong>明天的傳說。</strong></h1><p>翻開書本、累積專注能量，用每一次完成的任務，讓自己的冒險者再強一點。</p><div class="btn-row" style="margin-top:23px"><button class="button primary" data-nav="study">📚 前往書房 <span>→</span></button><button class="button soft" data-nav="dungeon">⚔️ 挑戰地城</button></div></div><div class="hero-illustration"><div class="floor"></div>${heroSVG}<div class="hero-badge">LV.${p.level} · 知識勇者</div></div></section>
<div class="section-label"><h2>今日冒險紀錄 <span style="font-size:12px;color:var(--muted);font-weight:500">${formatToday()}</span></h2><small>每天進步一點點</small></div>
<div class="grid-four">${kpi('⏳',`${state.study.todayMinutes} min`,'今日專注時間')}${kpi('✅',state.study.todayTasks,'今日完成任務')}${kpi('⚡',`${p.ap} AP`,'可使用的戰鬥點數')}${kpi('🏆',`第 ${state.progress.chapter} 關`,'目前冒險進度')}</div>
<div class="section-label"><h2>你的冒險進度</h2><small>讀書與戰鬥，互相成就</small></div>
<div class="grid-two"><div class="card card-pad"><div class="avatar-panel"><div class="mini-hero">${heroSVG}</div><div><span class="tag gold">LEVEL ${p.level}</span><h2 style="margin:12px 0 7px">見習知識勇者</h2><p class="muted tiny" style="margin:0 0 13px">完成學習目標，繼續積累經驗值。</p><div class="row tiny"><span>經驗值 EXP</span><b>${p.xp} / ${levelThreshold(p.level)}</b></div><div class="progress" style="margin-top:8px"><span style="width:${p.xp/levelThreshold(p.level)*100}%"></span></div></div></div><div class="divider"></div><div class="row"><span class="muted">♥ HP ${p.hp}/${maxHP()}　⚔ ATK ${attackStat()}　🛡 DEF ${defenseStat()}</span><button class="button sm soft" data-nav="character">角色資訊 →</button></div></div>
<div class="card card-pad"><div class="row"><span class="inner-heading">NEXT ENCOUNTER</span><span class="tag ${m.kind==='BOSS'?'red':m.kind==='ELITE'?'gold':'mint'}">${m.kind}</span></div><h2 style="margin:17px 0 6px">${m.name}</h2><div class="muted" style="line-height:1.8">第 ${state.progress.chapter} 關 · 第 ${state.progress.step+1} / 5 隻敵人</div><div class="row" style="margin:13px 0 8px"><span class="muted tiny">怪物 HP</span><b>${enemyHP()} / ${m.hp}</b></div><div class="progress red"><span style="width:${enemyHP()/m.hp*100}%"></span></div><div class="row" style="margin-top:26px;gap:10px;flex-wrap:wrap"><span class="tag blue">⚔ ATK ${m.atk}</span><button class="button sm primary" data-nav="dungeon">進入地城 →</button></div></div></div>
<div class="section-label"><h2>選擇接下來的行動</h2></div><div class="grid-two"><button class="tile-link" data-nav="study"><span class="tile-icon">📚</span><span><strong>繼續專注讀書</strong><small>專注計時、規劃任務、獲得 AP</small></span><span class="arrow">↗</span></button><button class="tile-link" data-nav="shop"><span class="tile-icon">🛍️</span><span><strong>準備冒險裝備</strong><small>用金幣購買武器、防具與藥水</small></span><span class="arrow">↗</span></button></div>`}
function timerSegment(){return `<div class="card timer-card"><div class="row"><span class="inner-heading">FOCUS TIMER</span><span class="tag ${state.timer.running?'mint':'gold'}" id="timer-state-label">${state.timer.running?'● 專注中':'○ 待機中'}</span></div><div class="mode-tabs" style="margin-top:17px"><button class="${state.timer.type==='focus'?'selected':''}" data-act="timer-type" data-value="focus" ${state.timer.running?'disabled':''}>📖 專注時間</button><button class="${state.timer.type==='break'?'selected':''}" data-act="timer-type" data-value="break" ${state.timer.running?'disabled':''}>☕ 休息時間</button></div><div class="timer-ring" id="timer-ring"><div class="timer-inner"><span class="eyebrow" id="timer-caption" style="font-size:10px">${state.timer.type==='focus'?'FOCUS SESSION':'REST TIME'}</span><div class="timer-digits" id="timer-digits">${remainFmt(remainingMs())}</div><span class="muted tiny" id="timer-subline">${state.timer.running?'保持專注，你做得到':'每一分鐘都算數'}</span></div></div>
<div class="btn-row" style="justify-content:center"><button class="button primary" data-act="timer-start" id="timer-start-btn">${state.timer.running?'進行中…':remainingMs()<=0?'↻ 開始新一輪':'▶ 開始計時'}</button><button class="button soft" data-act="timer-pause" ${!state.timer.running?'disabled':''}>Ⅱ 暫停</button><button class="button soft" data-act="timer-reset">↻ 重設</button></div>
<div class="divider"></div><div class="inner-heading">${state.timer.type==='focus'?'選擇專注時間':'設定休息時間'}</div>${state.timer.type==='focus'?`<div class="preset-row" style="margin:12px 0">${[15,25,45,60].map(m=>`<button class="button sm ${state.timer.minutes===m?'primary':'soft'}" data-act="timer-preset" data-value="${m}" ${state.timer.running||demo?'disabled':''}>${m} 分</button>`).join('')}</div><div class="inline-form"><span class="muted tiny">自訂（15–120 分鐘，每次 5 分）</span><input aria-label="自訂專注時間" id="focus-minutes" type="number" min="15" max="120" step="5" value="${state.timer.minutes}" ${state.timer.running||demo?'disabled':''}><button class="button sm soft" data-act="timer-custom" ${state.timer.running||demo?'disabled':''}>套用</button></div>`:`<div class="inline-form" style="margin-top:14px"><span class="muted tiny">休息時間（1–30 分鐘）</span><input aria-label="休息分鐘數" id="break-minutes" type="number" min="1" max="30" step="1" value="${state.timer.breakMinutes}" ${state.timer.running?'disabled':''}><button class="button sm soft" data-act="break-custom" ${state.timer.running?'disabled':''}>套用</button></div>`}<p class="helper" style="margin-top:16px">${demo?'🧪 展示模式每次專注只需要 15 秒，完成後獲得展示用 AP。':state.timer.type==='break'?'休息時間不發放 AP，休息結束後可以再進行下一輪專注。':'完成專注每 5 分鐘獲得 1 AP。中途重設不會發放獎勵。'}</p></div>`}
function taskForm(){let item=state.tasks.find(t=>t.id===editingTaskId),x=item||{title:'',subject:'',difficulty:'normal',priority:'medium',due:'',subtasks:[]};return `<div class="card card-pad"><div class="row" style="margin-bottom:18px"><div class="card-title">${item?'✏️ 編輯讀書任務':'✦ 建立讀書任務'}</div>${item?'<button class="button sm soft" data-act="edit-cancel">取消編輯</button>':''}</div><form id="task-form" class="form-grid"><div class="field span-2"><label for="task-name">任務名稱 *</label><input id="task-name" name="title" required maxlength="90" placeholder="例如：完成資料探勘 Chapter 3 筆記" value="${esc(x.title)}"></div><div class="field"><label for="task-subject">科目</label><input id="task-subject" name="subject" maxlength="40" placeholder="例如：資料探勘" value="${esc(x.subject)}"></div><div class="field"><label for="task-date">截止日期</label><input id="task-date" name="due" type="date" value="${esc(x.due)}"></div><div class="field"><label for="task-level">難度</label><select id="task-level" name="difficulty">${[['easy','簡單 · 2 AP'],['normal','普通 · 4 AP'],['hard','困難 · 7 AP']].map(([k,v])=>`<option value="${k}" ${x.difficulty===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label for="task-priority">優先順序</label><select id="task-priority" name="priority">${Object.entries(taskPriorities).map(([k,v])=>`<option value="${k}" ${x.priority===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="field span-2"><label for="task-subtasks">子任務（每行一項，選填）</label><textarea id="task-subtasks" name="subtasks" placeholder="閱讀講義\n整理重點\n完成練習題">${esc((x.subtasks||[]).map(s=>s.name).join('\n'))}</textarea></div><button class="button primary span-2" type="submit">${item?'儲存任務修改':'＋ 新增任務'}</button></form></div>`}
function taskItem(t){let completed=t.subtasks.filter(s=>s.done).length,total=t.subtasks.length;let overdue=t.due&&!t.done&&t.due<dateKey();let diffColor={easy:'mint',normal:'blue',hard:'red'}[t.difficulty];return `<article class="task-item ${t.done?'done':''}"><div class="task-head"><div style="min-width:0;flex:1"><div class="task-title">${esc(t.title)}</div><div class="task-meta">${t.subject?`<span class="tag">${esc(t.subject)}</span>`:''}<span class="tag ${diffColor}">${({easy:'簡單',normal:'普通',hard:'困難'})[t.difficulty]} · ${difficultyRewards[t.difficulty]} AP</span><span class="tag gold">${taskPriorities[t.priority]}優先</span>${t.due?`<span class="tag ${overdue?'red':''}">📅 ${esc(t.due)}${overdue?' · 已逾期':''}</span>`:''}${t.rewarded?'<span class="tag mint">已領獎</span>':''}</div></div><div class="btn-row"><button class="button sm ${t.done?'soft':'mint'}" data-act="task-complete" data-value="${esc(t.id)}">${t.done?'↶ 改為未完成':'✓ 完成任務'}</button><button class="button sm soft" data-act="task-edit" data-value="${esc(t.id)}">編輯</button><button class="button sm danger" data-act="task-delete" data-value="${esc(t.id)}">刪除</button></div></div>${total?`<div class="task-subs">${t.subtasks.map((s,i)=>`<label class="task-sub ${s.done?'checked':''}"><input type="checkbox" data-subtask="${esc(t.id)}" data-index="${i}" ${s.done?'checked':''}><span>${esc(s.name)}</span></label>`).join('')}<div class="row tiny"><span class="muted">子任務進度 ${completed}/${total}</span><b>${Math.round(completed/total*100)}%</b></div><div class="progress mint" style="height:6px"><span style="width:${completed/total*100}%"></span></div></div>`:''}</article>`}
function pageStudy(){let items=state.tasks.filter(t=>taskFilter==='all'||(taskFilter==='done'?t.done:!t.done));return `<div class="page-heading"><div class="eyebrow">✦ THE LIBRARY</div><h1>專注書房 <span style="color:var(--gold)">📚</span></h1><p>先完成今天的學習目標，再把讀書成果變成地城中的力量。你的每一段專注都會累積。</p></div><div class="timer-layout">${timerSegment()}<div class="stack"><div class="card card-pad"><div class="row"><div class="card-title">🛡️ 專注模式</div><span class="tag blue">${state.timer.mode==='strict'?'嚴格模式':'線上學習'}</span></div><p class="helper" style="margin:13px 0">${state.timer.mode==='strict'?'切換到其他分頁就自動暫停。適合在網站上專心計時。':'允許切換分頁看影片、PDF 或查資料。重新整理或關閉網頁仍會暫停。'}</p><div class="segmented"><button class="${state.timer.mode==='strict'?'selected':''}" data-act="focus-mode" data-value="strict">🛡️ 嚴格模式</button><button class="${state.timer.mode==='online'?'selected':''}" data-act="focus-mode" data-value="online">🌐 線上學習</button></div><p class="helper" style="margin-top:12px">網頁僅防止基本重複領獎，不會監控你是否真的在讀書。</p></div>
<div class="grid-two" style="gap:12px">${kpi('🎯',`${state.study.todayMinutes} min`,'今日專注')}${kpi('⚡',`${state.study.earnedToday}/40`,'今日 AP 額度')}</div><div class="card card-pad"><div class="row"><div class="card-title">📊 累積成果</div><span class="tag mint">努力不會消失</span></div><div class="avatar-stats" style="margin-top:13px"><div class="avatar-stat"><span class="muted">累積專注</span><b>${state.study.totalMinutes} 分鐘</b></div><div class="avatar-stat"><span class="muted">完成專注場次</span><b>${state.study.totalSessions} 次</b></div><div class="avatar-stat"><span class="muted">完成任務</span><b>${state.study.tasksDone} 項</b></div><div class="avatar-stat"><span class="muted">今日已獲得 AP</span><b>${state.study.earnedToday}/40</b></div></div></div></div></div>
<div class="section-label"><h2>任務冒險日誌</h2><small>完成主任務才能獲得 AP，子任務只計進度</small></div><div class="grid-two">${taskForm()}<div class="card card-pad"><div class="row" style="gap:7px;flex-wrap:wrap"><div class="card-title">📋 任務清單</div><span class="tag">共 ${state.tasks.length} 項</span></div><div class="segmented" style="margin:16px 0"><button class="${taskFilter==='open'?'selected':''}" data-act="task-filter" data-value="open">未完成</button><button class="${taskFilter==='done'?'selected':''}" data-act="task-filter" data-value="done">已完成</button><button class="${taskFilter==='all'?'selected':''}" data-act="task-filter" data-value="all">全部</button></div><div class="task-list">${items.length?items.map(taskItem).join(''):'<div class="empty"><div class="emoji">📝</div>目前沒有符合條件的任務。<br>新增一個學習目標，開始今天的冒險吧！</div>'}</div></div></div>`}
function pageDungeon(){let e=monster(),mhp=enemyHP(),p=state.player;return `<div class="page-heading"><div class="eyebrow">✦ DUNGEON RAID</div><h1>冒險地城 <span style="color:var(--red)">⚔️</span></h1><p>專注讀書累積的 AP，就是你在地城中的行動力。每次行動怪物會反擊，但只有你主動戰鬥才會發生。</p></div><div class="row" style="margin-bottom:14px;flex-wrap:wrap"><div class="stats-inline"><span class="tag gold">⚡ AP ${p.ap}</span><span class="tag blue">第 ${state.progress.chapter} 關</span><span class="tag ${e.kind==='BOSS'?'red':e.kind==='ELITE'?'gold':'mint'}">${e.kind} · ${state.progress.step+1} / 5</span></div><button class="button sm soft" data-nav="study">AP 不夠？回書房 →</button></div><div class="grid-two"><div class="card monster-card"><div class="inner-heading">BATTLE FIELD · ENCOUNTER ${state.progress.step+1}</div><div class="battlefield"><div class="fighter" id="player-fighter"><div class="fighter-status"><div class="row tiny"><b>勇者 LV.${p.level}</b><span>${p.hp}/${maxHP()}</span></div><div class="progress mint"><span style="width:${p.hp/maxHP()*100}%"></span></div></div>${heroSVG}<div class="fighter-label">⚔️ 知識勇者</div></div><span class="arena-vs">VS</span><div class="fighter monster" id="enemy-fighter"><div class="fighter-status"><div class="row tiny"><b>${e.name}</b><span>${mhp}/${e.hp}</span></div><div class="progress red"><span style="width:${mhp/e.hp*100}%"></span></div></div>${monsterSVG(e.type)}<div class="fighter-label">${e.kind==='BOSS'?'🔥 ':e.kind==='ELITE'?'👑 ':'✦ '}${e.name}</div></div><div class="scene-deco"></div></div><div class="alert" style="margin-top:9px">${p.boost?'🛡️ 防禦蓄力已啟動！下一次攻擊將造成 1.5 倍傷害。':`怪物攻擊力 ${e.atk} · 勝利獎勵 EXP +${e.xp}／🪙 +${e.gold}`}</div></div><div class="stack"><div class="card card-pad"><div class="row"><div class="card-title">🗡️ 選擇戰鬥行動</div><span class="tag gold">⚡ ${p.ap} AP</span></div><p class="helper" style="margin:12px 0 18px">普通攻擊與防禦一開始就能使用，其他技能會隨角色等級解鎖。</p><div class="battle-actions"><button class="button primary" data-act="battle" data-value="attack" ${p.ap<1?'disabled':''}><strong>⚔️ 普通攻擊</strong><small>1 AP · 基本傷害</small></button><button class="button violet" data-act="battle" data-value="heavy" ${p.level<2||p.ap<3?'disabled':''}><strong>💥 強力攻擊</strong><small>${p.level<2?'LV.2 解鎖':'3 AP · 約 2.5 倍傷害'}</small></button><button class="button soft" data-act="battle" data-value="defend" ${p.ap<1?'disabled':''}><strong>🛡️ 防禦蓄力</strong><small>1 AP · 減傷＋下次增傷</small></button><button class="button mint" data-act="battle" data-value="heal" ${p.level<3||p.ap<3||p.hp>=maxHP()?'disabled':''}><strong>💚 治療</strong><small>${p.level<3?'LV.3 解鎖':'3 AP · 恢復 HP'}</small></button></div><div class="divider"></div><div class="row" style="flex-wrap:wrap"><span class="muted tiny">🧪 HP 藥水：${p.potions} 瓶（使用後怪物會反擊）</span><button class="button sm soft" data-act="potion" ${p.potions<1||p.hp>=maxHP()?'disabled':''}>使用藥水（HP +36）</button></div></div><div class="card card-pad"><div class="row"><div class="card-title">📜 戰鬥紀錄</div><span class="inner-heading">LATEST ACTIONS</span></div><div class="log" id="battle-log">${logs.slice().reverse().map(s=>`<div class="line">${esc(s)}</div>`).join('')}</div></div></div></div><div class="section-label"><h2>地城關卡說明</h2></div><div class="grid-three">${[['🌿','普通怪物 × 3','適合累積經驗與金幣'],['👑','精英怪物 × 1','高血量與攻擊力'],['🐉','Boss × 1','擊敗後進入下一關']].map(v=>`<div class="card card-pad"><div style="font-size:25px">${v[0]}</div><div style="font-weight:900;margin:11px 0 6px">${v[1]}</div><div class="muted tiny">${v[2]}</div></div>`).join('')}</div>`}
function pageCharacter(){let p=state.player;let equipped=gear.filter(g=>p.owned.includes(g.id));return `<div class="page-heading"><div class="eyebrow">✦ CHARACTER SHEET</div><h1>角色背包 <span>🧙</span></h1><p>每一次挑戰都是成長的證明。查看你的能力、技能、裝備，為下一場地城做好準備。</p></div><div class="grid-two"><div class="card card-pad"><div class="avatar-panel"><div class="mini-hero">${heroSVG}</div><div><span class="tag gold">LEVEL ${p.level}</span><h2 style="margin:12px 0 8px">知識勇者</h2><div class="row tiny"><span class="muted">EXP</span><b>${p.xp}/${levelThreshold(p.level)}</b></div><div class="progress" style="margin-top:8px"><span style="width:${p.xp/levelThreshold(p.level)*100}%"></span></div></div></div><div class="divider"></div><div class="avatar-stats"><div class="avatar-stat"><span>♥ 生命值</span><b>${p.hp} / ${maxHP()}</b></div><div class="avatar-stat"><span>⚔️ 攻擊力</span><b>${attackStat()}</b></div><div class="avatar-stat"><span>🛡️ 防禦力</span><b>${defenseStat()}</b></div><div class="avatar-stat"><span>⚡ 行動點數</span><b>${p.ap} AP</b></div><div class="avatar-stat"><span>🪙 金幣</span><b>${p.gold}</b></div></div></div>
<div class="card card-pad"><div class="card-title">✨ 已解鎖技能</div><div class="panel-list" style="margin-top:15px">${[['⚔️','普通攻擊','LV.1','1 AP · 基本傷害',true],['🛡️','防禦蓄力','LV.1','1 AP · 減傷＋強化下一次攻擊',true],['💥','強力攻擊','LV.2','3 AP · 2.5 倍傷害',p.level>=2],['💚','治療術','LV.3','3 AP · 恢復 HP',p.level>=3]].map(s=>`<div class="gear-item" style="opacity:${s[4]?1:.56}"><span class="gear-art">${s[0]}</span><div class="gear-main"><strong>${s[1]}</strong><p>${s[3]}</p></div><span class="tag ${s[4]?'mint':''}">${s[4]?'已解鎖':s[2]}</span></div>`).join('')}</div></div></div>
<div class="section-label"><h2>裝備與道具</h2><small>取得裝備後可以隨時更換</small></div><div class="grid-two"><div class="card card-pad"><div class="card-title">🎒 我的背包</div><div class="gear-item" style="margin-top:15px"><span class="gear-art">🧪</span><div class="gear-main"><strong>HP 回復藥水 × ${p.potions}</strong><p>使用後恢復 36 HP</p></div><button class="button sm mint" data-act="potion" ${p.potions<1||p.hp>=maxHP()?'disabled':''}>使用</button></div><div class="divider"></div><div class="inner-heading">已擁有裝備</div><div class="panel-list" style="margin-top:14px">${equipped.length?equipped.map(g=>`<div class="gear-item"><span class="gear-art">${g.icon}</span><div class="gear-main"><strong>${g.name}</strong><p>${g.desc}</p></div><button class="button sm ${p[g.kind]===g.id?'mint':'soft'}" data-act="equip" data-value="${g.id}" ${p[g.kind]===g.id?'disabled':''}>${p[g.kind]===g.id?'已裝備':'裝備'}</button></div>`).join(''):'<div class="empty">尚未取得裝備。<br>去商店看看適合你的武器和防具！</div>'}</div></div><div class="card card-pad"><div class="card-title">🗡️ 目前裝備</div><div class="avatar-stats" style="margin-top:15px"><div class="avatar-stat"><span>⚔️ 武器</span><b>${gear.find(g=>g.id===p.weapon)?.name||'初學者木劍'}</b></div><div class="avatar-stat"><span>🛡️ 防具</span><b>${gear.find(g=>g.id===p.armor)?.name||'布製練習服'}</b></div><div class="avatar-stat"><span>目前挑戰</span><b>第 ${state.progress.chapter} 關 · ${state.progress.step+1}/5</b></div></div><p class="helper" style="margin-top:18px">裝備效果會即時套用到戰鬥能力。HP 藥水在主城使用不會觸發怪物反擊。</p><button class="button primary full" data-nav="shop" style="margin-top:14px">前往冒險商店 →</button></div></div>`}
function pageShop(){let p=state.player;return `<div class="page-heading"><div class="eyebrow">✦ MERCHANT'S GUILD</div><h1>冒險商店 <span>🛍️</span></h1><p>你的努力會帶來獎賞。使用擊敗怪物得到的金幣，購買藥水或更強大的冒險裝備。</p></div><div class="row" style="margin-bottom:19px;flex-wrap:wrap"><span class="tag gold" style="font-size:14px;padding:11px 16px">🪙 目前金幣 ${p.gold} GOLD</span><span class="muted tiny">武器增加 ATK；防具減少怪物傷害</span></div><div class="section-label"><h2>補給道具</h2></div><div class="card card-pad"><div class="gear-item"><span class="gear-art">🧪</span><div class="gear-main"><strong>HP 回復藥水</strong><p>恢復 36 HP · 可重複購買 · 目前擁有 ${p.potions} 瓶</p></div><div style="text-align:right"><div style="color:var(--gold);font-weight:900;margin-bottom:9px">🪙 25</div><button class="button sm primary" data-act="buy" data-value="potion" ${p.gold<25?'disabled':''}>購買</button></div></div></div><div class="section-label"><h2>武器與防具</h2><small>每種裝備只需購買一次</small></div><div class="grid-two">${gear.map(g=>{let owned=p.owned.includes(g.id),on=p[g.kind]===g.id;return `<div class="card card-pad"><div class="gear-item" style="border:0;background:transparent;padding:0"><span class="gear-art" style="width:69px;height:69px;font-size:35px">${g.icon}</span><div class="gear-main"><span class="tag ${g.kind==='weapon'?'red':'blue'}">${g.kind==='weapon'?'武器 WEAPON':'防具 ARMOR'}</span><h3 style="margin:9px 0 6px">${g.name}</h3><p>${g.desc}</p></div></div><div class="divider"></div><div class="row"><b style="color:var(--gold)">${owned?'已購入':'🪙 '+g.price+' GOLD'}</b><button class="button sm ${owned?'soft':'primary'}" data-act="${owned?'equip':'buy'}" data-value="${g.id}" ${on||(!owned&&p.gold<g.price)?'disabled':''}>${on?'已裝備':owned?'裝備':'購買裝備'}</button></div></div>`}).join('')}</div>`}
function pageSettings(){return `<div class="page-heading"><div class="eyebrow">✦ SETTINGS & LAB</div><h1>遊戲設定 <span>⚙️</span></h1><p>調整讀書與遊戲體驗，或進入獨立展示模式，快速檢查主要互動功能。</p></div><div class="grid-two"><div class="card card-pad"><div class="card-title">🎵 體驗設定</div><div class="setting-line"><div><strong>基本音效</strong><p class="helper" style="margin:6px 0 0">完成專注、攻擊、勝利和升級時播放音效。</p></div><label class="switch"><input aria-label="啟用音效" id="sound-toggle" type="checkbox" ${state.sound?'checked':''}>${state.sound?'開啟':'關閉'}</label></div><div class="setting-line"><div><strong>專注模式</strong><p class="helper" style="margin:6px 0 0">嚴格模式會在切換分頁時暫停；線上學習模式不會。</p></div><span class="tag">${state.timer.mode==='strict'?'嚴格模式':'線上學習'}</span></div><button class="button soft" data-nav="study" style="margin-top:16px">前往書房調整 →</button></div><div class="card card-pad"><div class="card-title">🧪 快速展示模式</div><p class="helper" style="margin:15px 0">專為作品展示設計，將專注計時縮短至 <strong style="color:var(--gold)">15 秒</strong>，並建立獨立的角色與地城測試資料。</p><div class="alert info">展示進度不寫入正式存檔。退出展示模式後，原本的 AP、裝備、讀書紀錄及關卡都會保留。</div><button class="button ${demo?'danger':'violet'} full" data-act="${demo?'exit-demo':'enter-demo'}" style="margin-top:16px">${demo?'↩ 退出展示，回到正式遊戲':'🧪 啟動 15 秒展示模式'}</button>${demo?'<div class="btn-row" style="margin-top:13px"><button class="button sm soft" data-act="demo-boss">召喚 Boss</button><button class="button sm soft" data-act="demo-levelup">體驗升級</button><button class="button sm soft" data-act="demo-ap">取得展示 AP</button></div>':''}</div></div><div class="section-label"><h2>存檔與獎勵說明</h2></div><div class="grid-two"><div class="card card-pad"><div class="card-title">💾 自動儲存</div><p class="helper" style="margin:15px 0">正式進度自動儲存在此瀏覽器的 localStorage。重新整理會保留讀書、角色、裝備、地城等資料，但進行中的計時會暫停。</p><div class="alert">換裝置、換瀏覽器或清除網站資料後，原本存檔不會自動同步。</div></div><div class="card card-pad"><div class="card-title">⚡ AP 獎勵規則</div><div class="avatar-stats" style="margin-top:14px"><div class="avatar-stat"><span>專注每 5 分鐘</span><b>+1 AP</b></div><div class="avatar-stat"><span>簡單任務</span><b>+2 AP</b></div><div class="avatar-stat"><span>普通任務</span><b>+4 AP</b></div><div class="avatar-stat"><span>困難任務</span><b>+7 AP</b></div><div class="avatar-stat"><span>每日獎勵上限</span><b>40 AP</b></div></div><p class="helper" style="margin-top:12px">每日上限僅限制新取得的 AP，已累積的 AP 不會清空。</p></div></div><div class="section-label"><h2>近期讀書獎勵</h2></div><div class="card card-pad">${state.study.history.length?`<div class="history">${state.study.history.slice(0,10).map(h=>`<div class="history-line"><div><strong>${esc(h.label)}</strong><br><span class="tiny">${esc(h.time)}</span></div><span class="tag ${h.ap?'mint':'gold'}">+${h.ap} AP</span></div>`).join('')}</div>`:'<div class="empty">尚無紀錄。完成一次讀書專注或任務，就會在這裡看到成果。</div>'}</div>`}
function refreshTimerUI(){if(route!=='study')return;let ring=document.getElementById('timer-ring');if(!ring)return;const t=state.timer,rem=remainingMs(),total=(demo&&t.type==='focus'?15:t.type==='focus'?t.minutes*60:t.breakMinutes*60)*1000;ring.style.setProperty('--timer-progress',Math.max(0,Math.min(100,(1-rem/total)*100))+'%');const d=document.getElementById('timer-digits');if(d)d.textContent=remainFmt(rem);const l=document.getElementById('timer-state-label');if(l)l.textContent=t.running?'● 計時中':rem===0?'✓ 已完成':'○ 已暫停／待機';const st=document.getElementById('timer-subline');if(st)st.textContent=t.running?'保持專注，你做得到':rem===0?'完成這一輪啦！':'每一分鐘都算數'}
function showToast(msg,kind=''){const z=document.getElementById('toast-zone');const n=document.createElement('div');n.className='toast '+(kind||'');n.textContent=msg;z.appendChild(n);setTimeout(()=>{n.remove()},4500)}
function log(msg){logs.push(msg);if(logs.length>14)logs.shift()}
function playSound(type){if(!state.sound)return;try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;audioCtx=audioCtx||new Audio();audioCtx.resume();let notes=type==='reward'?[523,659,784]:type==='hit'?[250,190]:type==='win'?[392,523,659,880]:[440,550];const now=audioCtx.currentTime;notes.forEach((freq,i)=>{let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.setValueAtTime(freq,now+i*.09);g.gain.setValueAtTime(.035,now+i*.09);g.gain.exponentialRampToValueAtTime(.001,now+i*.09+.15);o.connect(g);g.connect(audioCtx.destination);o.start(now+i*.09);o.stop(now+i*.09+.16)})}catch{}}
function taskSubmit(form){const fd=new FormData(form),title=String(fd.get('title')||'').trim();if(!title)return showToast('請輸入任務名稱','error');const names=String(fd.get('subtasks')||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean).slice(0,30);let existing=state.tasks.find(t=>t.id===editingTaskId);let oldByName=new Map((existing?.subtasks||[]).map(s=>[s.name,s]));let subtasks=names.map(name=>({name,done:Boolean(oldByName.get(name)?.done)}));let patch={title,subject:String(fd.get('subject')||'').trim(),due:String(fd.get('due')||''),difficulty:String(fd.get('difficulty')||'normal'),priority:String(fd.get('priority')||'medium'),subtasks};if(existing){Object.assign(existing,patch);if(existing.done&&existing.subtasks.some(s=>!s.done))existing.done=false;showToast('任務已更新！','good')}else{state.tasks.unshift({id:uid(),...patch,done:false,rewarded:false});showToast('任務新增成功！','good')}editingTaskId=null;save();renderAll()}
function taskComplete(id){let t=state.tasks.find(x=>x.id===id);if(!t)return;if(t.done){t.done=false;save();renderAll();return}if(t.subtasks.some(s=>!s.done))return showToast('請先完成所有子任務，才能完成主任務。','error');t.done=true;if(!t.rewarded){t.rewarded=true;normalizeDay();state.study.tasksDone++;state.study.todayTasks++;grantAP(difficultyRewards[t.difficulty],`完成任務「${t.title.slice(0,17)}」`)}else showToast('任務標示完成；此任務的 AP 之前已領取。');save();renderAll()}
function toggleSubtask(id,index,checked){let t=state.tasks.find(x=>x.id===id);if(!t||!t.subtasks[index])return;t.subtasks[index].done=checked;if(!checked&&t.done)t.done=false;save();renderAll()}
function checkWinOrCounter(guard){const p=state.player;const e=monster();if(enemyHP()<=0){const lvlOld=p.level;p.gold+=e.gold;p.xp+=e.xp;let levels=0;while(p.xp>=levelThreshold(p.level)){p.xp-=levelThreshold(p.level);p.level++;levels++;p.hp=maxHP()}if(state.progress.step===4){state.progress.chapter++;state.progress.step=0;log('🏆 Boss 被擊敗！開啟第 '+state.progress.chapter+' 關！')}else{state.progress.step++;log('🌟 已擊敗 '+e.name+'，下一個挑戰等待著你。')}state.progress.monsterHp=null;p.boost=false;log(`獲得 EXP +${e.xp}、金幣 +${e.gold}${levels?'，角色升至 LV.'+p.level+'！':''}`);showToast(levels?`🎉 勝利並升級至 LV.${p.level}！`:`🏆 勝利！獲得 ${e.gold} 金幣及 ${e.xp} EXP`,'good');playSound('win');return}
let damage=Math.max(1,e.atk-defenseStat());if(guard)damage=Math.max(1,Math.round(damage*.3));p.hp=Math.max(0,p.hp-damage);log(`💢 ${e.name} 反擊，受到 ${damage} 傷害。`);if(p.hp<=0){p.hp=maxHP();p.boost=false;state.progress.monsterHp=null;log('🏕️ 勇者倒下，回到營地恢復 HP。當前怪物重新挑戰。');showToast('🏕️ 戰敗回營地！等級、金幣與讀書成果都保留。','error')}}
function battle(action){const p=state.player;const need={attack:1,heavy:3,heal:3,defend:1}[action];if(!need||p.ap<need)return showToast('AP 不足，先完成讀書獲得行動點數！','error');if(action==='heavy'&&p.level<2||action==='heal'&&p.level<3)return showToast('尚未解鎖此技能！','error');if(action==='heal'&&p.hp>=maxHP())return showToast('HP 已滿，不需要治療。');p.ap-=need;let enemy=monster();if(action==='defend'){p.boost=true;log('🛡️ 勇者防禦並蓄力，這回合受到的傷害降低。');checkWinOrCounter(true)}else if(action==='heal'){const healed=Math.min(maxHP()-p.hp,Math.max(18,Math.floor(maxHP()*.3)));p.hp+=healed;log(`💚 勇者治療，恢復 ${healed} HP。`);checkWinOrCounter(false)}else{let damage=Math.round(attackStat()*(action==='heavy'?2.5:1)*(p.boost?1.5:1));p.boost=false;state.progress.monsterHp=Math.max(0,enemyHP()-damage);log(`⚔️ ${action==='heavy'?'強力攻擊':'普通攻擊'}造成 ${damage} 傷害！`);playSound('hit');checkWinOrCounter(false)}save();renderAll()}
function usePotion(){let p=state.player;if(!p.potions)return showToast('沒有 HP 藥水，去商店購買吧。','error');if(p.hp>=maxHP())return showToast('目前 HP 已滿。');p.potions--;let restored=Math.min(36,maxHP()-p.hp);p.hp+=restored;log(`🧪 使用 HP 藥水，恢復 ${restored} HP。`);if(route==='dungeon')checkWinOrCounter(false);showToast(`恢復 ${restored} HP！`,'good');save();renderAll()}
function buy(id){const p=state.player;const product=id==='potion'?{price:25,name:'HP 回復藥水'}:gear.find(g=>g.id===id);if(!product)return;if(id!=='potion'&&p.owned.includes(id))return showToast('已購買過該裝備。');if(p.gold<product.price)return showToast('金幣不足！','error');p.gold-=product.price;if(id==='potion')p.potions++;else{p.owned.push(id);p[product.kind]=id}showToast(`購買成功：${product.name}`,'good');playSound('reward');save();renderAll()}
function equip(id){const p=state.player,product=gear.find(g=>g.id===id);if(!product||!p.owned.includes(id))return;p[product.kind]=id;showToast(`已裝備 ${product.name}`,'good');save();renderAll()}
function createDemo(){const d=defaultState();d.player.level=2;d.player.xp=levelThreshold(2)-24;d.player.hp=maxHPFor(2);d.player.ap=18;d.player.gold=160;d.player.potions=3;d.study.earnedToday=0;d.timer.minutes=25;d.timer.remainingMs=15000;d.tasks=[{id:uid(),title:'閱讀冒險者研究手冊',subject:'展示任務',due:'',difficulty:'easy',priority:'medium',subtasks:[{name:'翻開第一頁',done:true},{name:'整理兩個重點',done:false}],done:false,rewarded:false}];return d}
function maxHPFor(l){return 100+(l-1)*16}
function enterDemo(){pauseTimer(true);save();demo=true;state=createDemo();logs=['🧪 展示開始！可以用 15 秒計時領 AP，也能體驗戰鬥及角色升級。'];route='hub';showToast('已進入獨立展示模式，正式存檔不受影響。','good');renderAll()}
function exitDemo(){if(!demo)return;demo=false;state=load();timerAnchor=0;route='hub';logs=['歡迎回到正式冒險！'];showToast('已恢復正式遊戲進度。','good');renderAll()}
function demoBoss(){if(!demo)return;state.progress.step=4;state.progress.monsterHp=null;state.player.ap=Math.max(25,state.player.ap);log('🔥 展示模式召喚了 Boss！');showToast('展示 Boss 已登場！','good');openPage('dungeon')}
function demoLevelup(){if(!demo)return;state.player.xp=levelThreshold(state.player.level)-1;const e=monster();state.progress.monsterHp=1;state.player.ap+=8;showToast('已準備升級測試：攻擊眼前怪物即可升級。','good');openPage('dungeon')}
function tick(){if(!state.timer.running)return;if(remainingMs()<=0){finishTimer();return}refreshTimerUI();const ms=remainingMs();if(Math.floor(ms/1000)%5===0)save()}
// All interactive controls are event-delegated so that navigating/re-rendering does not lose behavior.
document.addEventListener('click',e=>{const n=e.target.closest('[data-nav]');if(n){openPage(n.dataset.nav);return}const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act,v=b.dataset.value;switch(a){case 'timer-start':startTimer();break;case 'timer-pause':pauseTimer();renderAll();break;case 'timer-reset':resetTimer();renderAll();break;case 'timer-type':if(state.timer.running)return;resetTimer(v);renderAll();break;case 'timer-preset':state.timer.minutes=Number(v);resetTimer();renderAll();break;case 'timer-custom':{let m=Number(document.getElementById('focus-minutes')?.value);if(!Number.isInteger(m)||m<15||m>120||m%5)return showToast('請設定 15～120 分鐘且為 5 的倍數。','error');state.timer.minutes=m;resetTimer();renderAll();break}case 'break-custom':{let m=Number(document.getElementById('break-minutes')?.value);if(!Number.isInteger(m)||m<1||m>30)return showToast('請設定 1～30 分鐘的整數。','error');state.timer.breakMinutes=m;resetTimer();renderAll();break}case 'focus-mode':state.timer.mode=v;if(state.timer.running&&v==='strict'&&document.hidden)pauseTimer(true);save();renderAll();break;case 'task-filter':taskFilter=v;renderAll();break;case 'task-complete':taskComplete(v);break;case 'task-edit':editingTaskId=v;renderAll();document.getElementById('task-form')?.scrollIntoView({behavior:'smooth',block:'center'});break;case 'edit-cancel':editingTaskId=null;renderAll();break;case 'task-delete':{let t=state.tasks.find(x=>x.id===v);if(!t)return;if(confirm(`確定刪除任務「${t.title}」？已領取的 AP 不會被扣除。`)){state.tasks=state.tasks.filter(x=>x.id!==v);if(editingTaskId===v)editingTaskId=null;save();renderAll()}break}case 'battle':battle(v);break;case 'potion':usePotion();break;case 'buy':buy(v);break;case 'equip':equip(v);break;case 'enter-demo':enterDemo();break;case 'exit-demo':exitDemo();break;case 'demo-boss':demoBoss();break;case 'demo-levelup':demoLevelup();break;case 'demo-ap':if(demo){state.player.ap+=15;showToast('展示 AP +15（不影響正式紀錄）','good');renderAll()}break;}});
document.addEventListener('submit',e=>{if(e.target.id==='task-form'){e.preventDefault();taskSubmit(e.target)}});
document.addEventListener('change',e=>{const el=e.target;if(el.matches('[data-subtask]'))toggleSubtask(el.dataset.subtask,Number(el.dataset.index),el.checked);if(el.id==='sound-toggle'){state.sound=el.checked;save();showToast(state.sound?'已開啟音效。':'已關閉音效。');renderAll()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.timer.running&&state.timer.mode==='strict')pauseTimer(true);if(!document.hidden){tick();if(route==='study')renderAll()}});
window.addEventListener('pagehide',()=>{if(state.timer.running)pauseTimer(true);save()});
window.addEventListener('beforeunload',()=>{if(state.timer.running)pauseTimer(true);save()});
window.addEventListener('focus',()=>{normalizeDay();tick()});
setInterval(tick,500);
// Daily rollover; keeps the 40-AP grant limit accurate across midnight.
setInterval(()=>{if(state.study.day!==dateKey()){normalizeDay();renderAll()}},30000);
renderAll();
</script>
</body>
